<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 인사총무 ERP — 교육용</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f5f2; --surface:#fcfcfb; --surface-2:#f0efec;
  --border:#e3e2dd; --grid:#ebeae6;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#85847e;
  --series-1:#2a78d6; --series-soft:#cde2fb;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-bg:#e7f6e7; --warn-bg:#fdf3dd; --crit-bg:#fbe8e8;
  --good-ink:#0a6b0a; --warn-ink:#7a5600; --crit-ink:#9c2020;
  --banner-bg:#fff3d1; --banner-ink:#6b4e00; --banner-bd:#e8d08a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232320;
    --border:#33332f; --grid:#2a2a27;
    --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8f8e85;
    --series-1:#3987e5; --series-soft:#1c3a5e;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --good-bg:#14331a; --warn-bg:#3a2f10; --crit-bg:#3a1b1b;
    --good-ink:#7ddc7d; --warn-ink:#f2c65c; --crit-ink:#f09090;
    --banner-bg:#3a2f10; --banner-ink:#f0d99a; --banner-bd:#5c4a1a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text-1);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.55;
}

/* ── 교육용 고정 배너 (표시 위치 2/4) ───────────────── */
#edu-banner{
  position:sticky; top:0; z-index:50;
  background:var(--banner-bg); color:var(--banner-ink);
  border-bottom:1px solid var(--banner-bd);
  padding:7px 16px; font-size:12.5px; font-weight:600;
  text-align:center; letter-spacing:-.01em;
}
#edu-banner span{font-weight:400; opacity:.85}

/* ── 헤더 ─────────────────────────────────────────── */
header{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  padding:14px 20px; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.brand{font-size:17px; font-weight:700; letter-spacing:-.02em}
.brand small{display:block; font-size:11.5px; font-weight:400; color:var(--text-3); letter-spacing:0}
.spacer{flex:1}
.rolebox{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.rolenow{font-size:12.5px; color:var(--text-2)}
.rolenow b{color:var(--text-1)}
button{font:inherit; cursor:pointer}
.btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-1);
  padding:7px 13px; border-radius:8px; font-size:13px; font-weight:600;
}
.btn:hover{border-color:var(--text-3)}
.btn-primary{background:var(--series-1); border-color:var(--series-1); color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.42; cursor:not-allowed; filter:none}
.btn-sm{padding:4px 10px; font-size:12px; border-radius:6px}
.btn-ok{background:var(--good-bg); border-color:transparent; color:var(--good-ink)}
.btn-no{background:var(--crit-bg); border-color:transparent; color:var(--crit-ink)}
.btn-ghost{background:transparent; color:var(--text-2)}

/* ── 레이아웃 ─────────────────────────────────────── */
.layout{display:grid; grid-template-columns:186px 1fr; gap:0; min-height:calc(100vh - 100px)}
nav{
  background:var(--surface); border-right:1px solid var(--border);
  padding:16px 12px; display:flex; flex-direction:column; gap:4px;
}
.navitem{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  color:var(--text-2); padding:10px 12px; border-radius:8px;
  font-size:14px; font-weight:600;
}
.navitem:hover{background:var(--surface-2); color:var(--text-1)}
.navitem.on{background:var(--series-soft); color:var(--series-1)}
:root:not([data-theme="light"]) .navitem.on{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .navitem.on{color:#cde2fb}}
.navnote{margin-top:auto; font-size:11px; color:var(--text-3); padding:10px 12px; line-height:1.5}
main{padding:22px 24px 60px; min-width:0}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  nav{flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--border); padding:10px}
  .navitem{width:auto; white-space:nowrap}
  .navnote{display:none}
  main{padding:16px 14px 50px}
}

h2.page{font-size:20px; margin:0 0 4px; letter-spacing:-.02em}
p.pagesub{margin:0 0 20px; color:var(--text-2); font-size:13px}

/* ── 카드 / 타일 ──────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px}
.card h3{margin:0 0 2px; font-size:14.5px; letter-spacing:-.01em}
.card .sub{margin:0 0 14px; font-size:12px; color:var(--text-3)}
.grid{display:grid; gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px}
.tile .lab{font-size:12px; color:var(--text-2); margin-bottom:6px}
.tile .val{font-size:26px; font-weight:700; letter-spacing:-.03em; line-height:1.15}
.tile .val .u{font-size:14px; font-weight:600; color:var(--text-2); margin-left:2px}
.tile .foot{font-size:11.5px; color:var(--text-3); margin-top:6px}
.tile.hero{grid-column:span 1}
.tile.hero .val{font-size:48px}
.tile.alert{border-color:var(--warn)}
.tile.alert .val{color:var(--warn-ink)}

/* ── 표 ───────────────────────────────────────────── */
.tablewrap{overflow-x:auto; margin:0 -2px}
table{border-collapse:collapse; width:100%; font-size:13px; white-space:nowrap}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--border)}
th{font-size:11.5px; font-weight:600; color:var(--text-3); text-transform:none; background:var(--surface-2)}
th:first-child{border-top-left-radius:7px} th:last-child{border-top-right-radius:7px}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tr.mine td{background:var(--series-soft)}
:root:not([data-theme="light"]) tr.mine td{background:#1c3a5e}
tr.mine:hover td{filter:brightness(.97)}
tr.dim td{color:var(--text-3)}
.linkbtn{background:none; border:0; padding:0; font:inherit; font-weight:600; color:var(--series-1);
  text-decoration:underline; text-underline-offset:2px; cursor:pointer}
.linkbtn:hover{filter:brightness(1.15)}
tr.total td{background:var(--surface-2); font-size:13.5px}
.footnote{margin:8px 2px 0; font-size:11px; color:var(--text-3)}
.empty{padding:26px 10px; text-align:center; color:var(--text-3); font-size:13px}

/* ── 상태 배지 (아이콘+글자+색 = 색만으로 구분하지 않음) ── */
.badge{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap}
.badge.b-ok{background:var(--good-bg); color:var(--good-ink)}
.badge.b-wait{background:var(--warn-bg); color:var(--warn-ink)}
.badge.b-no{background:var(--crit-bg); color:var(--crit-ink)}
.badge.b-low{background:var(--warn-bg); color:var(--warn-ink)}
/* 취소는 상태색 3종(승인·대기·반려)과 섞지 않는 중립색 */
.badge.b-cancel{background:var(--surface-2); color:var(--text-2)}

/* 고정폭 — 사번·번호·날짜·금액·일수. 한글에는 쓰지 않음 (DESIGN.md §12-②) */
.mono{font-family:ui-monospace,"Cascadia Mono","Consolas","D2Coding",monospace;
  letter-spacing:.02em; font-variant-numeric:tabular-nums}

/* ── 폼 ───────────────────────────────────────────── */
.form{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); align-items:end}
.field label{display:block; font-size:11.5px; color:var(--text-2); margin-bottom:5px; font-weight:600}
.field input,.field select{
  width:100%; padding:8px 10px; border-radius:8px; font:inherit; font-size:13px;
  border:1px solid var(--border); background:var(--bg); color:var(--text-1);
}
.field input:focus,.field select:focus{outline:2px solid var(--series-1); outline-offset:-1px}
.alertbox{
  margin-top:12px; padding:10px 13px; border-radius:8px; font-size:12.5px; font-weight:600;
  background:var(--crit-bg); color:var(--crit-ink); display:flex; gap:7px; align-items:flex-start;
}
.alertbox.ok{background:var(--good-bg); color:var(--good-ink)}
.alertbox.info{background:var(--surface-2); color:var(--text-2); font-weight:400}

/* ── 차트 ─────────────────────────────────────────── */
.chartbox svg{width:100%; height:auto; display:block; overflow:visible}
.axis{font-size:10.5px; fill:var(--text-3)}
.vlabel{font-size:11px; font-weight:700; fill:var(--text-2)}
.gridline{stroke:var(--grid); stroke-width:1}
.bar{fill:var(--series-1); transition:fill-opacity .12s}
.barhit{fill:transparent; cursor:pointer}
.barhit:hover + .bar, .bar.hot{fill-opacity:.72}
#tip{
  position:fixed; pointer-events:none; z-index:99; opacity:0; transition:opacity .1s;
  background:var(--text-1); color:var(--bg); padding:6px 10px; border-radius:7px;
  font-size:12px; font-weight:600; white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,.22);
}
</style>
</head>

    const used    = es.reduce((s,e) => s + usedDays(e.id), 0);
    return {dept:d, granted, used, rate: granted ? used / granted * 100 : 0};
  });
}

  const g = DATA_EMP.reduce((s,e) => s + e.granted, 0);

function leaveHistory(id){
  const e = emp(id);
  const rows = [{date:null, label:'2026년 연차 부여', delta:e.granted, note:'1년치 연차가 한 번에 부여됩니다'}];

  LEAVE.filter(r => r.emp === id)
       .slice()
       .sort((a,b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0)
       .forEach(r => {
    const cut = deducts(r);
    rows.push({
      date : r.start,
      label: `${r.id} · ${r.type} ${n1(r.days)}일`,
      delta: cut ? -r.days : 0,
      note : cut                  ? '승인됨 → 연차에서 차감'
           : r.type === '병가'     ? `병가 ${r.status} → 연차는 차감하지 않음`
           : r.status === '대기'   ? `아직 대기 중 → 승인되면 ${n1(r.days)}일 차감 예정`

    });
  });

  let bal = 0;
  rows.forEach(r => { bal += r.delta; r.bal = bal; });
  return rows;
}

/* ── 5. 막대그래프 (인라인 SVG · 라이브러리 없음) ─── */

function topRounded(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h));
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}

/** rows: [{label, value, text, tip}] — 단일 시리즈이므로 범례 없음(제목이 곧 시리즈명) */
function barChart(rows, opt){
  opt = opt || {};
  const W = 380, H = 196, padL = 40, padR = 12, padT = 22, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB, base = padT + plotH;
  const raw  = Math.max(...rows.map(r => r.value), 0);
  // 눈금(0 · 중간 · 최대)이 모두 깔끔한 정수가 되도록 step의 2배 단위로 올림
  const step = (opt.step || 5) * 2;
  const max  = Math.max(step, Math.ceil(raw / step) * step);
  const band = plotW / rows.length;
  const bw   = Math.min(24, band - 16);

  let g = '';
  for(let t = 0; t <= max; t += max / 2){
    const y = base - t / max * plotH;
    g += `<line class="gridline" x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}"></line>`;
    g += `<text class="axis" x="${padL-7}" y="${y+3.5}" text-anchor="end">${opt.tick ? opt.tick(t) : n0(t)}</text>`;
  }
  let b = '';
  rows.forEach((r,i) => {
    const h = max ? r.value / max * plotH : 0;
    const x = padL + band*i + (band - bw)/2;
    const y = base - h;
    b += `<rect class="barhit" x="${padL+band*i+1}" y="${padT}" width="${band-2}" height="${plotH}"
            data-tip="${esc(r.tip)}"></rect>`;
    b += `<path class="bar" d="${topRounded(x, y, bw, Math.max(h,1.5), 4)}"></path>`;
    b += `<text class="vlabel" x="${x+bw/2}" y="${y-7}" text-anchor="middle">${esc(r.text)}</text>`;
    b += `<text class="axis" x="${padL+band*i+band/2}" y="${base+17}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'')}">
    ${g}<line class="gridline" x1="${padL}" y1="${base}" x2="${padL+plotW}" y2="${base}"></line>${b}
  </svg></div>`;
}

      <td>${badge(r.status)}${over ? ' <span class="badge b-low">⚠️ 잔여 초과</span>' : ''}</td>

      <tbody>${done.map(r => `<tr>
        <td class="mono">${r.id}</td><td>${emp(r.emp).name}</td><td>${item(r.item).name}</td>
        <td class="num mono">${r.qty}</td><td class="num mono">${won(supplyAmt(r))}</td>
        <td>${esc(r.reason)}${r.note ? ` <span style="color:var(--crit-ink)">(${esc(r.note)})</span>` : ''}</td>
        <td>${badge(r.status)}</td><td>${dash(nameOf(r.by))} · <span class="mono">${dash(r.on)}</span></td></tr>`).join('')}</tbody>
    </table></div>${FOOT}
  </div>`;
}

/* ── 8-1. 화면 : 급여명세 (조회 전용) ────────────────
   ⚠️ 입력·수정·계산 버튼을 두지 않습니다.
   확정된 급여를 고치는 것은 실무 금기이며, PRD §6-7의 결정입니다.     */

const payOf = id => DATA_PAY.find(p => p.emp === id);
// 급여 화면 공통 경고 (교육용 표시 보강)
const PAY_WARN = '<div class="alertbox info" style="margin:0 0 16px">⚠️ '
  + '<span>실제 세금·4대보험은 계산하지 않은 <b>가상 금액</b>입니다. '
  + '실제 급여대장에는 국민연금·건강보험·고용보험·소득세·지방소득세가 각각 따로 들어갑니다.</span></div>';

function viewPay(){ return role === 'admin' ? payAdmin() : payStaff(); }

function payStaff(){
  const me = emp(ME), p = payOf(ME);
  const line = (label, amount, sign) => `<tr>
    <td>${label}</td>
    <td class="num mono">${sign === '-' ? '−' : sign === '+' ? '+' : ''}${n0(amount)}</td></tr>`;

  return `
  <h2 class="page">💰 급여명세</h2>
  <p class="pagesub">${me.dept} ${me.grade} <b>${me.name}</b> · 보기 전용 화면입니다 (수정할 수 없습니다)</p>
  ${PAY_WARN}

  <div class="grid cols2">
    <div class="card">
      <h3>2026년 9월 귀속 급여명세서</h3>
      <p class="sub">급여번호 <span class="mono">${p.id}</span> ·
        귀속연월 <span class="mono">${p.month}</span> ·
        지급일 <span class="mono">${p.payDate}</span> · 상태 ${p.status}</p>
      <div class="tablewrap"><table>
        <thead><tr><th>항목</th><th class="num">금액 (원)</th></tr></thead>
        <tbody>
          ${line('기본급', p.base, '')}
          ${line('수당', p.allow, '+')}
          ${line('공제', p.deduct, '-')}
          <tr class="total"><td><b>실제 지급액</b></td>
            <td class="num mono"><b>${n0(p.net)}</b></td></tr>
        </tbody>
      </table></div>${FOOT}
    </div>

    <div class="card">
      <h3>이 금액은 어떻게 나왔나</h3>
      <p class="sub">급여는 계산해서 보여주는 값이 아니라, <b>확정된 그대로 저장된 기록</b>입니다</p>
      <div class="tile" style="margin-bottom:12px">
        <div class="lab">지급액 계산식</div>
        <div class="val mono" style="font-size:17px; line-height:1.7">
          ${n0(p.base)}<br>
          <span style="color:var(--good-ink)">+ ${n0(p.allow)}</span><br>
          <span style="color:var(--crit-ink)">− ${n0(p.deduct)}</span><br>
          <span style="border-top:1px solid var(--border); display:inline-block; padding-top:4px">
            = ${n0(p.net)}</span>
        </div>
        <div class="foot">기본급 + 수당 − 공제</div>
      </div>
      <div class="alertbox info">💡
        <span><b>잔여연차는 계산하고, 지급액은 저장합니다.</b><br>
        잔여연차는 승인할 때마다 바뀌어야 하는 <b>현재값</b>이지만,
        지급액은 이미 통장에 나간 <b>과거 기록</b>이라 바뀌면 안 되기 때문입니다.</span></div>
    </div>
  </div>`;
}

function payAdmin(){
  const total = DATA_PAY.reduce((s,p) => s + p.net, 0);
  const base  = DATA_PAY.reduce((s,p) => s + p.base, 0);
  const allow = DATA_PAY.reduce((s,p) => s + p.allow, 0);
  const ded   = DATA_PAY.reduce((s,p) => s + p.deduct, 0);

  return `
  <h2 class="page">💰 급여명세 — 전 직원</h2>
  <p class="pagesub">2026년 9월 귀속분 · 보기 전용 화면입니다 (수정할 수 없습니다)</p>
  ${PAY_WARN}

  <div class="grid tiles" style="margin-bottom:14px">
    <div class="tile hero">
      <div class="lab">총 지급액</div>
      <div class="val mono" style="font-size:34px">${n0(total)}<span class="u">원</span></div>
      <div class="foot">${DATA_PAY.length}명 · 2026년 9월 귀속</div>
    </div>
    <div class="tile"><div class="lab">기본급 합계</div>
      <div class="val mono" style="font-size:20px">${n0(base)}</div><div class="foot">원</div></div>
    <div class="tile"><div class="lab">수당 합계</div>
      <div class="val mono" style="font-size:20px">${n0(allow)}</div><div class="foot">원</div></div>
    <div class="tile"><div class="lab">공제 합계</div>
      <div class="val mono" style="font-size:20px">${n0(ded)}</div><div class="foot">원</div></div>
  </div>

  <div class="card">
    <h3>직원별 급여명세 ${DATA_PAY.length}건</h3>
    <p class="sub">사번으로 직원 정보와 연결됩니다 · 귀속연월(일한 달)과 지급일(돈 나간 날)은 다릅니다</p>
    <div class="tablewrap"><table>
      <thead><tr><th>급여번호</th><th>사번</th><th>이름</th><th>부서</th><th>직급</th>
        <th>귀속</th><th>지급일</th>
        <th class="num">기본급</th><th class="num">수당</th><th class="num">공제</th>
        <th class="num">지급액</th><th>상태</th></tr></thead>
      <tbody>${DATA_PAY.map(p => { const e = emp(p.emp); return `<tr${p.emp === ME ? ' class="mine"' : ''}>
        <td class="mono">${p.id}</td><td class="mono">${p.emp}</td>
        <td>${e.name}</td><td>${e.dept}</td><td>${e.grade}</td>
        <td class="mono">${p.month}</td><td class="mono">${p.payDate}</td>
        <td class="num mono">${n0(p.base)}</td>
        <td class="num mono">${n0(p.allow)}</td>
        <td class="num mono">${n0(p.deduct)}</td>
        <td class="num mono"><b>${n0(p.net)}</b></td>
        <td>${p.status}</td></tr>`; }).join('')}
        <tr class="total"><td colspan="7"><b>합계</b></td>
          <td class="num mono"><b>${n0(base)}</b></td>
          <td class="num mono"><b>${n0(allow)}</b></td>
          <td class="num mono"><b>${n0(ded)}</b></td>
          <td class="num mono"><b>${n0(total)}</b></td><td></td></tr>
      </tbody>
    </table></div>${FOOT}
  </div>`;
}

/* ── 9. 렌더 ─────────────────────────────────────── */

function render(){
  const me = emp(ME), ad = emp(ADMIN);
  document.getElementById('roleName').textContent =
    role === 'admin' ? `🧑‍💼 ${ad.name} (인사총무 담당자)` : `👤 ${me.name} (${me.dept} ${me.grade})`;
  document.getElementById('roleBtn').textContent =
    role === 'admin' ? '👤 직원 시점으로 보기' : '🧑‍💼 담당자 시점으로 보기';

  document.querySelectorAll('.navitem').forEach(b =>
    b.classList.toggle('on', b.dataset.page === page));

  // 이 화면의 숫자가 어디서 왔는지 표시 (교육용)
  const src = document.getElementById('srcNote');
  if(src) src.innerHTML = (DATA_SOURCE.방식 === '파일' ? '📂 <b>데이터 파일</b>' : '📦 <b>내장 데이터</b>')
    + '<br><span style="opacity:.8">' + esc(DATA_SOURCE.설명) + '</span>';

  const body = page === 'home'  ? (role === 'admin' ? viewHomeAdmin() : viewHomeStaff())
             : page === 'leave' ? viewLeave()
             : page === 'pay'   ? viewPay()
             : viewSupply();

  const msg = flash
    ? `<div class="alertbox ${flash.kind}" style="margin:0 0 16px">${flash.icon} ${esc(flash.text)}</div>` : '';
  document.getElementById('main').innerHTML = msg + body;
  flash = null;
  wireTooltips();
}

function wireTooltips(){
  const tip = document.getElementById('tip');
  document.querySelectorAll('.barhit').forEach(el => {
    el.addEventListener('mousemove', e => {
      tip.textContent = el.dataset.tip;
      tip.style.opacity = '1';
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + 'px';
      tip.style.top  = (e.clientY - 36) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
  });
}

function say(kind, icon, text){ flash = {kind, icon, text}; }

/* ── 10. 동작 ────────────────────────────────────── */

function daysBetween(a, b){
  const d = (new Date(b) - new Date(a)) / 86400000;
  return Math.round(d) + 1;
}

function submitLeave(){
  const type   = document.getElementById('lvType').value;
  const start  = document.getElementById('lvStart').value;
  const end0   = document.getElementById('lvEnd').value;
  const reason = document.getElementById('lvReason').value.trim() || '개인 사유';
  const msg    = document.getElementById('lvMsg');
  const end    = type === '반차' ? start : end0;
  const bad    = t => { msg.innerHTML = `<div class="alertbox">⚠️ ${t}</div>`; };

  if(!start || !end) return bad('시작일과 종료일을 입력해 주세요.');
  if(new Date(start) > new Date(end)) return bad('종료일이 시작일보다 빠릅니다. 날짜를 확인해 주세요.');

  const days = type === '반차' ? 0.5 : daysBetween(start, end);
  if(days <= 0) return bad('신청 일수가 0일입니다.');

  if(willUse({type}) && days > remainDays(ME))
    return bad(`남은 연차는 ${n1(remainDays(ME))}일인데 ${n1(days)}일을 신청했습니다. 잔여연차를 초과할 수 없습니다.`);

  LEAVE.push({id:'L' + String(++seqL).padStart(3,'0'), emp:ME, type, start, end, days,
              reason, status:'대기', by:null, on:null, note:null});
  say('ok','✅', `휴가 신청이 접수되었습니다. (${type} ${n1(days)}일) 담당자 시점으로 바꾸면 처리할 수 있습니다.`);
  render();
}

function submitSupply(){
  const code = document.getElementById('spItem').value;
  const qty  = parseInt(document.getElementById('spQty').value, 10);
  const reason = document.getElementById('spReason').value.trim() || '업무용';
  const msg  = document.getElementById('spMsg');
  const it   = item(code);
  const bad  = t => { msg.innerHTML = `<div class="alertbox">⚠️ ${t}</div>`; };

  if(!Number.isFinite(qty) || qty <= 0) return bad('수량은 1개 이상이어야 합니다.');
  if(qty > it.stock) return bad(`${it.name}의 현재고는 ${it.stock}개입니다. 재고보다 많이 신청할 수 없습니다.`);

  SUPPLY.push({id:'P' + String(++seqP).padStart(3,'0'), emp:ME, item:code, qty,
               reason, status:'대기', by:null, on:null, note:null});
  say('ok','✅', `비품 신청이 접수되었습니다. (${it.name} ${qty}개 · ${won(it.price*qty)})`);
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if(!t) return;

  if(t.id === 'roleBtn'){ role = role === 'admin' ? 'staff' : 'admin'; return render(); }
  if(t.id === 'resetBtn'){ resetData(); page = 'home'; say('info','↺','모든 데이터를 처음 상태로 되돌렸습니다.'); return render(); }
  if(t.dataset.page){ page = t.dataset.page; return render(); }
  if(t.id === 'lvSubmit') return submitLeave();
  if(t.id === 'spSubmit') return submitSupply();

  const d = t.dataset;

  if(d.emp){   // 사원 이름 클릭 → 연차 계산 내역 펼치기 / 접기
    openEmp = (d.emp === 'close' || openEmp === d.emp) ? null : d.emp;
    return render();
  }
  if(d.okLeave){
    const r = LEAVE.find(x => x.id === d.okLeave);
    r.status = '승인'; r.by = ADMIN; r.on = TODAY;
    say('ok','✅', willUse(r)
      ? `${r.id} 승인 완료 — ${emp(r.emp).name}님의 연차 ${n1(r.days)}일이 차감되어 잔여 ${n1(remainDays(r.emp))}일이 되었습니다.`
      : `${r.id} 승인 완료 — 병가이므로 ${emp(r.emp).name}님의 연차는 차감되지 않았습니다. (잔여 ${n1(remainDays(r.emp))}일 유지)`);
    return render();
  }
  if(d.noLeave){
    const r = LEAVE.find(x => x.id === d.noLeave);
    r.status = '반려'; r.by = ADMIN; r.on = TODAY; r.note = '담당자 반려';
    say('info','↩️', `${r.id} 반려 처리했습니다. ${emp(r.emp).name}님의 연차는 차감되지 않습니다. (잔여 ${n1(remainDays(r.emp))}일)`);
    return render();
  }
  if(d.okSupply){
    const r = SUPPLY.find(x => x.id === d.okSupply), it = item(r.item);
    r.status = '승인'; r.by = ADMIN; r.on = TODAY;
    it.stock -= r.qty;
    say('ok','✅', `${r.id} 승인 완료 — ${it.name} 재고가 ${it.stock + r.qty}개에서 ${it.stock}개로 줄었습니다.`
      + (it.stock < it.safe ? ` ⚠️ 안전재고(${it.safe}개) 미달입니다.` : ''));
    return render();
  }
  if(d.noSupply){
    const r = SUPPLY.find(x => x.id === d.noSupply), it = item(r.item);
    r.status = '반려'; r.by = ADMIN; r.on = TODAY; r.note = '담당자 반려';
    say('info','↩️', `${r.id} 반려 처리했습니다. ${it.name} 재고는 ${it.stock}개 그대로입니다.`);
    return render();
  }
  if(d.cancelLeave){
    // 기록을 지우지 않고 상태만 바꿉니다 (데이터안내.md §7 · PRD §6-3)
    const r = LEAVE.find(x => x.id === d.cancelLeave);
    r.status = '취소'; r.by = ME; r.on = TODAY; r.note = '신청자 취소';
    say('info','⊘', `${r.id} 신청을 취소했습니다. 기록은 '취소' 상태로 남습니다. `
      + `${emp(r.emp).name}님의 잔여 연차는 ${n1(remainDays(r.emp))}일 그대로입니다.`);
    return render();
  }
  if(d.cancelSupply){
    // 기록을 지우지 않고 상태만 바꿉니다 (데이터안내.md §7 · PRD §6-3)
    const r = SUPPLY.find(x => x.id === d.cancelSupply), it = item(r.item);
    r.status = '취소'; r.by = ME; r.on = TODAY; r.note = '신청자 취소';
    say('info','⊘', `${r.id} 신청을 취소했습니다. 기록은 '취소' 상태로 남습니다. `
      + `${it.name} 재고는 ${it.stock}개 그대로입니다.`);
    return render();
  }
});

// 외부 데이터 파일을 먼저 시도하고, 실패하면 내장 데이터로 그대로 실행합니다.
(async () => {
  await loadExternalData();
  resetData();
  render();
})();
</script>
